<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Input Prototype — 4 Scenarios</title>
<style>
  :root{
    --bg:#0d0d0d;
    --panel:#171717;
    --panel-2:#212121;
    --text:#ececec;
    --text-dim:#9b9b9b;
    --border:#2f2f2f;
    --accent:#10a37f;
    --warn-bg:#3a2a12;
    --warn-text:#e8a33d;
    --warn-border:#a06a1f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#050505;
    min-height:100vh;
    padding:28px 20px;
  }
  h1{
    color:var(--text);
    font-size:16px;
    font-weight:500;
    text-align:center;
    margin-bottom:4px;
  }
  .sub{
    color:#666;
    font-size:12px;
    text-align:center;
    margin-bottom:22px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(240px,260px));
    gap:22px;
    justify-content:center;
    max-width:600px;
    margin:0 auto;
  }
  @media (max-width:560px){
    .grid{ grid-template-columns:1fr; justify-items:center; }
  }
  .card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .card-label{
    color:var(--text-dim);
    font-size:11.5px;
    font-weight:500;
    text-align:center;
  }
  .phone{
    width:250px;
    height:430px;
    background:var(--bg);
    border-radius:24px;
    border:1px solid #222;
    box-shadow:0 16px 32px rgba(0,0,0,0.5);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  .topbar{
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);
    font-size:12.5px;
    font-weight:500;
    border-bottom:1px solid var(--border);
  }
  .chat{
    flex:1;
    padding:10px 11px 6px;
    display:flex;
    flex-direction:column;
    gap:8px;
    overflow-y:auto;
  }
  .bubble-user{
    align-self:flex-end;
    background:var(--panel-2);
    color:var(--text);
    padding:7px 10px;
    border-radius:14px 14px 3px 14px;
    max-width:85%;
    font-size:11.5px;
    line-height:1.4;
    opacity:0;
    transform:translateY(4px);
    animation:pop 0.25s ease forwards;
  }
  .bubble-ai{
    align-self:flex-start;
    color:var(--text);
    padding:4px 1px;
    max-width:90%;
    font-size:11.5px;
    line-height:1.45;
    opacity:0;
    transform:translateY(4px);
    animation:pop 0.25s ease forwards;
  }
  @keyframes pop{ to{ opacity:1; transform:translateY(0); } }
  .feedback-row{
    align-self:flex-start;
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--text-dim);
    font-size:10px;
    opacity:0;
    animation:pop 0.25s ease forwards;
    animation-delay:0.15s;
  }
  .fb-btn{
    width:19px; height:19px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:9.5px;
  }
  .fb-btn.picked{ background:var(--accent); border-color:var(--accent); }

  .inputzone{
    padding:8px 10px 14px;
    border-top:1px solid var(--border);
    background:var(--bg);
  }
  .tooltip{
    background:#fafafa;
    color:#0d0d0d;
    font-size:10px;
    padding:6px 9px;
    border-radius:8px;
    margin-bottom:6px;
    opacity:0;
    animation:pop 0.25s ease forwards;
    animation-delay:0.2s;
  }
  .inputbar{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:20px;
    min-height:38px;
    display:flex;
    align-items:center;
    padding:5px 6px 5px 12px;
    gap:6px;
  }
  .placeholder{ color:var(--text-dim); font-size:11.5px; flex:1; }
  .transcript-live{
    color:var(--text);
    font-size:11px;
    flex:1;
    line-height:1.3;
  }
  .transcript-live .cursor{
    display:inline-block;
    width:2px; height:11px;
    background:var(--accent);
    margin-left:2px;
    animation:blink 0.9s steps(1) infinite;
    vertical-align:middle;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  .mic-btn{
    width:28px; height:28px;
    border-radius:50%;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    border:none;
  }
  .mic-btn.listening{
    animation:pulse 1.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(16,163,127,0.45); }
    70%{ box-shadow:0 0 0 10px rgba(16,163,127,0); }
    100%{ box-shadow:0 0 0 0 rgba(16,163,127,0); }
  }
  .send-btn{
    width:28px; height:28px;
    border-radius:50%;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; border:none; flex-shrink:0;
  }
  .review-box{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 11px;
    margin-bottom:6px;
  }
  .review-text{
    font-size:11px;
    color:var(--text);
    line-height:1.6;
  }
  .flag{
    background:var(--warn-bg);
    color:var(--warn-text);
    border-bottom:2px solid var(--warn-border);
    padding:1px 3px;
    border-radius:3px;
    cursor:pointer;
  }
  .suggestions{
    display:flex;
    gap:6px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .chip{
    font-size:10px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:4px 8px;
    border-radius:11px;
    cursor:pointer;
  }
  .review-actions{ display:flex; justify-content:flex-end; margin-top:2px; }
  .dym-box{
    background:#0f2620;
    border:1px solid #1d4a3c;
    border-radius:10px;
    padding:8px 10px;
    margin-bottom:8px;
  }
  .dym-label{
    color:var(--accent);
    font-size:9.5px;
    font-weight:600;
    margin-bottom:4px;
  }
  .dym-text{
    color:var(--text);
    font-size:11px;
    line-height:1.45;
    margin-bottom:8px;
  }
  .dym-actions{
    display:flex;
    gap:8px;
  }
  .dym-btn{
    font-size:10px;
    padding:4px 10px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
  }
  .dym-btn.yes{
    background:var(--accent);
    color:#04140f;
    border-color:var(--accent);
    font-weight:600;
  }
  .no-speech-box{
    background:var(--panel-2);
    border:1px dashed var(--border);
    border-radius:12px;
    padding:12px;
    text-align:center;
    color:var(--text-dim);
    font-size:10.5px;
    margin-bottom:6px;
  }
  .retry-btn{
    display:inline-block;
    margin-top:8px;
    background:var(--accent);
    color:#04140f;
    font-size:10px;
    padding:5px 11px;
    border-radius:11px;
    cursor:pointer;
    border:none;
  }
  .replay{
    color:var(--accent);
    font-size:10.5px;
    cursor:pointer;
    text-decoration:underline;
    opacity:0;
  }
  .replay.show{ opacity:1; }
</style>
</head>
<body>

<h1>Voice Input — Catch &amp; Recover</h1>
<div class="sub">4 scenarios, one flow. Tap any mic to run that card independently.</div>
<div class="grid" id="grid"></div>

<script>
const SCENARIOS = [
  {
    label: '1 · Accent mishear',
    words: ["kal","exam","hai","mujhe","dar","lag","raha","hai"],
    misheardIndex: 4,
    misheard: "ghar",
    suggestions: ["dar","ghaar","ghor"],
    response: "Exam se pehle darr lagna normal hai — thoda prepare karo, break lo, khud pe bharosa rakho."
  },
  {
    label: '2 · Code-switch confusion',
    words: ["mera","scholarship","form","submit","nahi","hua"],
    misheardIndex: 3,
    misheard: "summit",
    suggestions: ["submit","submitted","sum it"],
    response: "Form submit nahi hua toh pehle check karo — deadline nikli toh nahi, documents sab uploaded hain ya nahi."
  },
  {
    label: '3 · Domain vocabulary',
    words: ["physics","ka","mock","test","kal","hai"],
    misheardIndex: 2,
    misheard: "lock",
    suggestions: ["mock","mach","mark"],
    response: "Mock test kal hai toh aaj sirf revision karo, naye topics mat shuru karo."
  },
  {
    label: '4 · No speech detected',
    type: 'error'
  }
];

const grid = document.getElementById('grid');

SCENARIOS.forEach(scn => grid.appendChild(buildCard(scn)));

function buildCard(scn){
  const card = document.createElement('div');
  card.className = 'card';

  const label = document.createElement('div');
  label.className = 'card-label';
  label.textContent = scn.label;
  card.appendChild(label);

  const phone = document.createElement('div');
  phone.className = 'phone';
  phone.innerHTML = `
    <div class="topbar">ChatGPT</div>
    <div class="chat"></div>
    <div class="inputzone">
      <div class="tooltip">See what I hear as you speak</div>
      <div class="inputbar">
        <span class="placeholder">Ask anything</span>
        <button class="mic-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#04140f" stroke-width="2.6" stroke-linecap="round"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z"/><path d="M19 11a7 7 0 01-14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
    </div>`;
  card.appendChild(phone);

  const replay = document.createElement('div');
  replay.className = 'replay';
  replay.textContent = '↻ Replay';
  card.appendChild(replay);

  const chat = phone.querySelector('.chat');
  const inputzone = phone.querySelector('.inputzone');
  const inputbar = phone.querySelector('.inputbar');
  const tooltip = phone.querySelector('.tooltip');
  const placeholder = phone.querySelector('.placeholder');
  const micBtn = phone.querySelector('.mic-btn');

  let corrected = null;
  let busy = false;

  micBtn.addEventListener('click', () => {
    if(busy) return;
    busy = true;
    if(scn.type === 'error'){ runNoSpeech(); }
    else { startListening(); }
  });

  replay.addEventListener('click', () => {
    chat.innerHTML = '';
    inputzone.innerHTML = `
      <div class="tooltip">See what I hear as you speak</div>
      <div class="inputbar">
        <span class="placeholder">Ask anything</span>
        <button class="mic-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#04140f" stroke-width="2.6" stroke-linecap="round"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z"/><path d="M19 11a7 7 0 01-14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>`;
    replay.classList.remove('show');
    // rebind by re-running buildCard's wiring via recursion-free re-init
    const newInputbar = phone.querySelector('.inputbar');
    const newMic = phone.querySelector('.mic-btn');
    busy = false;
    newMic.addEventListener('click', () => {
      if(busy) return;
      busy = true;
      if(scn.type === 'error'){ runNoSpeechOn(newInputbar, phone.querySelector('.tooltip'), phone.querySelector('.placeholder'), newMic); }
      else { startListeningOn(newInputbar, phone.querySelector('.tooltip'), phone.querySelector('.placeholder'), newMic); }
    });
  });

  function runNoSpeech(){ runNoSpeechOn(inputbar, tooltip, placeholder, micBtn); }
  function startListening(){ startListeningOn(inputbar, tooltip, placeholder, micBtn); }

  function runNoSpeechOn(bar, tip, ph, mic){
    tip.style.display = 'none';
    mic.classList.add('listening');
    setTimeout(() => {
      mic.classList.remove('listening');
      inputzone.innerHTML = `<div class="no-speech-box">Didn't catch that.<br><span class="retry-btn">Try again</span></div>`;
      inputzone.querySelector('.retry-btn').onclick = () => replay.click();
      replay.classList.add('show');
    }, 1200);
  }

  function startListeningOn(bar, tip, ph, mic){
    tip.style.display = 'none';
    mic.classList.add('listening');
    ph.style.display = 'none';

    const live = document.createElement('span');
    live.className = 'transcript-live';
    bar.insertBefore(live, mic);

    const displayWords = [...scn.words];
    displayWords[scn.misheardIndex] = scn.misheard;

    let i = 0;
    (function addWord(){
      if(i < displayWords.length){
        live.innerHTML = displayWords.slice(0,i+1).join(' ') + '<span class="cursor"></span>';
        i++;
        setTimeout(addWord, 220);
      } else {
        setTimeout(() => showReview(displayWords, mic), 400);
      }
    })();
  }

  function showReview(displayWords, mic){
    mic.classList.remove('listening');
    corrected = null;
    inputzone.innerHTML = '';

    const before = displayWords.slice(0, scn.misheardIndex).join(' ');
    const after = displayWords.slice(scn.misheardIndex+1).join(' ');
    const topGuess = scn.suggestions[0];
    const dymSentence = `${before} ${topGuess} ${after}`;

    const dym = document.createElement('div');
    dym.className = 'dym-box';
    dym.innerHTML = `
      <div class="dym-label">DID YOU MEAN THIS?</div>
      <div class="dym-text">"${dymSentence.charAt(0).toUpperCase() + dymSentence.slice(1)}"</div>
      <div class="dym-actions">
        <div class="dym-btn yes">Yes, that's right</div>
        <div class="dym-btn no">No, let me fix it</div>
      </div>`;
    inputzone.appendChild(dym);

    const box = document.createElement('div');
    box.className = 'review-box';
    const textEl = document.createElement('div');
    textEl.className = 'review-text';
    textEl.innerHTML = `${before} <span class="flag">${scn.misheard}</span> ${after}`;
    box.appendChild(textEl);

    const sugg = document.createElement('div');
    sugg.className = 'suggestions';
    sugg.style.display = 'none';
    scn.suggestions.forEach(w=>{
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = w;
      chip.onclick = () => { corrected = w; textEl.innerHTML = `${before} ${w} ${after}`; dym.remove(); };
      sugg.appendChild(chip);
    });
    box.appendChild(sugg);
    inputzone.appendChild(box);

    dym.querySelector('.yes').onclick = () => {
      corrected = topGuess;
      textEl.innerHTML = `${before} ${topGuess} ${after}`;
      dym.remove();
    };
    dym.querySelector('.no').onclick = () => {
      dym.remove();
      sugg.style.display = 'flex';
    };

    const actions = document.createElement('div');
    actions.className = 'review-actions';
    const sendBtn = document.createElement('button');
    sendBtn.className = 'send-btn';
    sendBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#04140f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
    sendBtn.onclick = () => {
      const arr = [...displayWords];
      arr[scn.misheardIndex] = corrected || scn.misheard;
      sendMessage(arr.join(' '));
    };
    actions.appendChild(sendBtn);
    inputzone.appendChild(actions);

    textEl.querySelector('.flag').onclick = () => { sugg.style.display = 'flex'; };
  }

  function sendMessage(text){
    inputzone.innerHTML = '';
    replay.classList.add('show');

    const userBubble = document.createElement('div');
    userBubble.className = 'bubble-user';
    userBubble.textContent = text.charAt(0).toUpperCase() + text.slice(1) + '?';
    chat.appendChild(userBubble);

    setTimeout(()=>{
      const aiBubble = document.createElement('div');
      aiBubble.className = 'bubble-ai';
      aiBubble.textContent = scn.response;
      chat.appendChild(aiBubble);
      chat.scrollTop = chat.scrollHeight;

      setTimeout(()=>{
        const fb = document.createElement('div');
        fb.className = 'feedback-row';
        fb.innerHTML = `<span>Heard right?</span><div class="fb-btn">👍</div><div class="fb-btn">👎</div>`;
        chat.appendChild(fb);
        [...fb.querySelectorAll('.fb-btn')].forEach(b => b.onclick = () => b.classList.add('picked'));
        chat.scrollTop = chat.scrollHeight;
      }, 350);
    }, 400);
  }

  return card;
}
</script>
</body>
</html>
